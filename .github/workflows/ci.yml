name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    # A hung step fails fast instead of running until the 6-hour GitHub limit.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      # Fails on moderate+ advisories in shipped dependencies; dev-only tooling is reviewed in
      # docs/quality/security.md.
      - run: pnpm audit:prod

  backend:
    name: Backend
    runs-on: ubuntu-latest
    # A hung step fails fast instead of running until the 6-hour GitHub limit.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json

      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet format --verify-no-changes --no-restore
      # Integration tests use Testcontainers; GitHub-hosted Ubuntu runners ship with Docker.
      - run: dotnet test --no-build --configuration Release
      - name: Vulnerable NuGet packages
        run: |
          dotnet list package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then exit 1; fi

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    # A hung step fails fast instead of running until the 6-hour GitHub limit.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: a secret committed and later removed is still a leak.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: End-to-end (Playwright + axe)
    runs-on: ubuntu-latest
    # A hung step fails fast instead of running until the 6-hour GitHub limit.
    timeout-minutes: 30
    needs: [frontend, backend]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: nexora
          POSTGRES_USER: nexora
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nexora -d nexora"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Throwaway CI database; the API runs its Development profile (migrations + demo catalog).
      ConnectionStrings__Nexora: Host=localhost;Port=5432;Database=nexora;Username=nexora;Password=ci-only-password
      Seed__Admin__Email: admin@nexora.test
      E2E_ADMIN_EMAIL: admin@nexora.test
      # No long-lived MSBuild/compiler helpers in this job (they would block Playwright's teardown).
      MSBUILDDISABLENODEREUSE: '1'
      DOTNET_CLI_USE_MSBUILD_SERVER: '0'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Generate a one-off admin password
        run: |
          password="ci-$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          echo "Seed__Admin__Password=$password" >> "$GITHUB_ENV"
          echo "E2E_ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Built here, without MSBuild node reuse or the shared compiler server: those background
      # processes would outlive the test run and block Playwright's server teardown.
      - name: Build the API
        run: dotnet build ../backend/src/Nexora.Api -p:UseSharedCompilation=false -nodeReuse:false

      # Playwright starts the API and the production preview itself (playwright.config.ts).
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
