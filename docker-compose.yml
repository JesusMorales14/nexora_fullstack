# Local development infrastructure. Usage:
#   cp .env.example .env   (then set your own local password)
#   docker compose up -d
services:
  postgres:
    image: postgres:18-alpine
    container_name: nexora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexora}
      POSTGRES_USER: ${POSTGRES_USER:-nexora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      # Bound to loopback only: the database is not reachable from the local network.
      # Host port defaults to 5433 so it does not clash with a locally installed PostgreSQL.
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      # PostgreSQL 18 images store data under /var/lib/postgresql/<major>/docker.
      - nexora-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Local SMTP server that captures every email (password resets...). Web UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.33.0
    container_name: nexora-mailpit
    restart: unless-stopped
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'

volumes:
  nexora-postgres-data:
